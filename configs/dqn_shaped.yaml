# Ablation P4: biased exploration + reward `shaped` (spec §5.5) — tín hiệu
# thưởng dày hơn (khoảng cách tới tâm khe) để DQN học nhanh hơn "đi vào khe".
total_timesteps: 300000
eval_freq: 10000
n_envs: 1
flap_bias: 0.1
reward_mode: shaped

hyperparameters:
  learning_rate: 0.0001
  buffer_size: 100000
  batch_size: 64
  gamma: 0.99
  exploration_fraction: 0.1
  exploration_final_eps: 0.01
  train_freq: 4
  target_update_interval: 1000
  policy_kwargs:
    net_arch: [64, 64]
