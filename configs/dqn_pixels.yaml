# Stretch goal: CNN DQN on 84x84x4 pixel observations.
policy: CnnPolicy
pixel_obs: true
total_timesteps: 2000000
eval_freq: 6250
n_envs: 8
# Pixel rendering is CPU-bound: SB3's default DummyVecEnv runs 8 envs
# serially (~56 step/s); SubprocVecEnv parallelizes rendering (~7x faster).
vec_env: subproc
vec_env_start_method: forkserver
# Periodic checkpoint of models/<run>/checkpoint.zip + replay buffer for --resume after a crash.
checkpoint_freq: 100000

hyperparameters:
  learning_rate: 0.0001
  buffer_size: 100000
  learning_starts: 10000
  batch_size: 32
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.1
  exploration_final_eps: 0.01
  gamma: 0.99
  # Stores only obs (next_obs = following slot): buffer 5.26 -> 2.63 GiB; a
  # prior run was OOM-killed around 650k steps. SB3 requires
  # handle_timeout_termination disabled with this option.
  optimize_memory_usage: true
  replay_buffer_kwargs:
    handle_timeout_termination: false
