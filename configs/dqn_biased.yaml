# Ablation P4: biased exploration (spec §5.6, §9) — random action trong pha
# epsilon-greedy chỉ flap với xác suất `flap_bias` thay vì 50/50 mặc định của
# SB3 (Discrete(2)), tránh đâm trần ngay lập tức trong lúc khám phá.
total_timesteps: 300000
eval_freq: 10000
n_envs: 1
flap_bias: 0.1

hyperparameters:
  learning_rate: 0.0001
  buffer_size: 100000
  batch_size: 64
  gamma: 0.99
  exploration_fraction: 0.1
  exploration_final_eps: 0.01
  train_freq: 4
  target_update_interval: 1000
  policy_kwargs:
    net_arch: [64, 64]
