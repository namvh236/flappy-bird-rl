# Ablation P4: biased exploration + frame_skip=2 (spec §9) — mỗi hành động
# lặp lại 2 frame lõi để giảm số quyết định ngẫu nhiên trong pha exploration.
total_timesteps: 300000
eval_freq: 10000
n_envs: 1
flap_bias: 0.1
frame_skip: 2

hyperparameters:
  learning_rate: 0.0001
  buffer_size: 100000
  batch_size: 64
  gamma: 0.99
  exploration_fraction: 0.1
  exploration_final_eps: 0.01
  train_freq: 4
  target_update_interval: 1000
  policy_kwargs:
    net_arch: [64, 64]
