[project]
name = "flappy-bird-ai"
version = "0.1.0"
description = "Flappy Bird AI Agent: Gymnasium env with DQN/PPO (stable-baselines3) and NEAT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame-ce==2.5.8",
    "gymnasium==1.3.0",
    "stable-baselines3==2.9.0",
    "torch==2.14.0",
    "neat-python==0.92",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "tensorboard==2.21.0",
    "imageio[ffmpeg]==2.37.4",
    "imageio-ffmpeg==0.6.0",
]

[project.scripts]
flappy-ai = "flappy_ai.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flappy_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/flappy_ai/game/legacy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
